name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build (packages and examples)
        run: go build ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tidy check
        run: |
          go mod tidy
          # --porcelain with an explicit "--" handles the case this module is
          # normally in: no go.sum at all, because there are no dependencies.
          # Without the separator git reads go.sum as a revision and exits 128,
          # which looks exactly like an untidy tree but is not one. This also
          # catches a go.sum that tidy newly created, which git diff would miss
          # because it is untracked.
          changed=$(git status --porcelain -- go.mod go.sum)
          if [ -n "$changed" ]; then
            echo "go mod tidy changed these files:"
            echo "$changed"
            git diff -- go.mod go.sum
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test
        run: go test ./...

      # The race detector cannot start on some Windows builds, so this is the
      # authoritative run for it.
      #
      # Coverage is measured over the library packages only. examples/ are
      # main packages, compiled by the build job above and not executed here;
      # counting their main() as uncovered would only dilute the number the
      # gate reads.
      - name: Test (race + coverage)
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out             . ./binding ./render ./middleware

      - name: Coverage gate (minimum 90%)
        run: |
          go tool cover -func=coverage.out | tail -20
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          # sh cannot compare decimals, so awk does the arithmetic.
          awk -v pct="$pct" 'BEGIN {
            if (pct + 0 < 90) {
              printf "FAIL: coverage %.1f%% is below the 90%% minimum", pct
              exit 1
            }
            printf "coverage %.1f%%, minimum 90%%", pct
          }'

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # The design rests on two claims about imports. Assert them, rather than
      # trusting review to notice the day one breaks.
      - name: Core imports nothing third-party
        run: |
          # A package is stdlib when its first path segment has no dot. The
          # standard library also vendors a few golang.org/x packages under
          # vendor/, which are stdlib internals, not dependencies.
          deps=$(go list -deps .             | grep -v '^github.com/gozarp/zarp'             | grep -v '^vendor/'             | grep '^[^/]*\.' || true)
          if [ -n "$deps" ]; then
            echo "core has non-stdlib dependencies:"; echo "$deps"; exit 1
          fi

      - name: Core imports none of the optional packages
        run: |
          bad=$(go list -deps . | grep -E 'zarp/(binding|render|middleware)' || true)
          if [ -n "$bad" ]; then
            echo "core imports an optional package:"; echo "$bad"; exit 1
          fi

      - name: Whole module has no third-party requirements
        run: |
          mods=$(go list -m all | tail -n +2)
          if [ -n "$mods" ]; then
            echo "module has third-party requirements:"; echo "$mods"; exit 1
          fi

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Not a performance gate — CI runners are too noisy for ns/op — but this
      # catches a benchmark that stops compiling or starts panicking.
      - name: Benchmarks (smoke)
        run: go test -bench=. -benchtime=10x -run XXX ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gosec reads the code: unchecked errors on security-relevant calls,
      # narrowing integer conversions, servers started without timeouts. It
      # runs in its own container, so no Go setup is needed here.
      #
      # The findings that are deliberate carry a "#nosec" annotation naming the
      # rule and the reason, and the run prints how many suppressions it
      # honoured, so one cannot be added quietly.
      - name: gosec
        uses: securego/gosec@v2.29.0
        with:
          args: ./...

      # govulncheck reads the dependency graph, which for this module is the
      # standard library and nothing else — so what it actually watches for is
      # a Go release fixing a vulnerability in a package zarp calls, and it
      # reports only the ones reachable from this code.
      #
      # It installs its own Go and would check the repository out again;
      # neither is wanted, and caching has nothing to cache without a go.sum.
      - name: govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: '1.25'
          go-package: ./...
          repo-checkout: false
          cache: false
